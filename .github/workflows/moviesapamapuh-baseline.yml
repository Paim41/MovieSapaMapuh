name: MovieSapaMapuh Android baseline

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/pencarimovie-server/**'
      - 'tools/build-tdlib.sh'
      - 'tools/verify-android-apk.py'
      - '.github/workflows/moviesapamapuh-baseline.yml'

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'Paim41/pencarimovie-server'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0 ndk;23.2.8568313'
      - name: Install native build prerequisites
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build gperf php-cli make perl g++ libssl-dev zlib1g-dev
      - uses: gradle/actions/setup-gradle@v4
      - name: Rebuild pinned TDLib for both ABIs
        env:
          MOVIESAPAMAPUH_BUILD_JOBS: '2'
        run: bash tools/build-tdlib.sh
      - name: Build original debug APKs
        working-directory: android/pencarimovie-server
        run: bash gradlew :app:assembleDebug :app:lintDebug :app:testDebugUnitTest --no-daemon --max-workers=2
      - name: Verify bundled libraries and web assets
        run: |
          python3 tools/verify-android-apk.py android/pencarimovie-server/app/build/outputs/apk/debug/*_universal.apk
          for apk in android/pencarimovie-server/app/build/outputs/apk/debug/*.apk; do
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk"
            sha256sum "$apk" > "$apk.sha256"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: original-android-baseline-debug
          path: |
            android/pencarimovie-server/app/build/outputs/apk/debug/*.apk
            android/pencarimovie-server/app/build/outputs/apk/debug/*.sha256
            android/pencarimovie-server/app/build/native-provenance.json
            android/pencarimovie-server/app/build/reports/
          if-no-files-found: error
